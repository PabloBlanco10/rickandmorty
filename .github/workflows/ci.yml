name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned development tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-tools"
          curl -fL --retry 3 https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.5/swiftformat.zip -o "$RUNNER_TEMP/swiftformat.zip"
          curl -fL --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/quality-tools"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/quality-tools"
          echo "$RUNNER_TEMP/quality-tools" >> "$GITHUB_PATH"
      - name: Check formatting and lint
        run: bash Scripts/check-quality.sh
      - name: Build application
        run: |
          xcodebuild -version
          xcodebuild -project RickAndMorty.xcodeproj \
            -scheme RickAndMorty -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Run Domain, Data and Presentation test targets
        run: |
          xcodebuild -project RickAndMorty.xcodeproj \
            -scheme RickAndMorty \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4.1' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/FoundationTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test
